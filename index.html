<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>think-cell로 편집</title>
<style>
  body { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; margin: 40px; color: #222; line-height: 1.6; }
  a.btn { display: inline-block; padding: 10px 18px; background: #1a73e8; color: #fff; border-radius: 6px; text-decoration: none; }
  .muted { color: #666; font-size: 14px; }
</style>
</head>
<body>
<h2>think-cell로 편집</h2>
<div id="ok" hidden>
  <p>PowerPoint를 여는 중입니다. 이 탭은 닫아도 됩니다.</p>
  <p><a class="btn" id="open" href="#">PPT로 열기</a></p>
  <p class="muted">처음 한 번은 크롬이 "열기"를 묻습니다. <b>이 사이트에서 항상 허용</b>에 체크하고 열기를 누르면 다음부터는 바로 열립니다.<br>
  아무 일도 일어나지 않으면 이 PC에 think-cell Bridge가 설치되지 않은 것입니다.
  <a href="https://drive.google.com/drive/folders/16z5MvGzcdmbNt9BhrUHVNbzX5wGbGhw2">설치 안내</a></p>
</div>
<p id="bad" hidden>잘못된 편집 링크입니다. 슬라이드에서 링크를 다시 눌러 주세요.</p>
<script>
  // 슬라이드 차트 링크(?id=<드라이브 파일 ID>&p=body|legend) → amcrtc://edit/<id> 로 바로 넘긴다.
  // 페이지는 아무 데이터도 읽거나 보내지 않는다. 파일을 여는 것은 PC 의 도우미이고, 드라이브 권한이 있어야 열린다.
  var raw = new URLSearchParams(location.search).get('id') || '';
  if (/^[A-Za-z0-9_-]{10,}$/.test(raw)) {
    var url = 'amcrtc://edit/' + raw;
    document.getElementById('open').href = url;
    document.getElementById('ok').hidden = false;
    location.href = url;
    // 탭은 자동으로 닫지 않는다 — 처음 쓰는 사람의 크롬 '항상 허용' 확인 창이 함께 사라질 수 있다.
  } else {
    document.getElementById('bad').hidden = false;
  }
</script>
</body>
</html>
